[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "body-field"
version = "0.1.0"
description = "Common surface-field interface for robot body quantities."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "meshcat>=0.3.2",
    "numpy>=2.0",
    "taichi>=1.7.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["body_field*"]

[tool.pytest.ini_options]
pythonpath = ["."]
