[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "body-field"
version = "0.1.0"
description = "Common surface-field interface for robot body quantities."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
taichi = ["taichi>=1.7.0"]
viz = ["meshcat>=0.3.2"]
test = ["pytest>=8"]
dev = [
    "meshcat>=0.3.2",
    "pytest>=8",
    "taichi>=1.7.0",
]
viser = [
    "viser>=1.0.30",
]

[tool.setuptools.packages.find]
include = ["body_field*"]

[tool.pytest.ini_options]
pythonpath = ["."]
